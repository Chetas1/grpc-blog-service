version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nilerr
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
  exclusions:
    paths:
      - proto
      - internal/mocks
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - prealloc

formatters:
  enable:
    - gofmt
    - goimports
